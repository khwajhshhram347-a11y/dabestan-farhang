<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رصد زنده آزمون‌ها | دبستان فرهنگ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style> body { font-family: 'Vazirmatn', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- نوار مدیریت بالا -->
    <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-ping"></span>
          <h1 class="text-xl font-black">مانیتورینگ زنده و مرکز ضد تقلب دبستان فرهنگ</h1>
        </div>
        <p class="text-xs text-slate-400 mt-1">رصد همزمان دانش‌آموزان پایه‌های مختلف بر اساس پین‌کد اختصاصی</p>
      </div>

      <div class="flex gap-2">
        <a href="create-exam.html" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-xl text-xs font-bold transition">
          مدیریت آزمون‌ها
        </a>
        <a href="dashboard.html" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-bold transition">
          داشبورد
        </a>
      </div>
    </div>

    <!-- جدول وضعیت زنده -->
    <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700 overflow-hidden">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-sm text-slate-300">لیست نشست‌های همزمان دانش‌آموزان</h2>
        <span class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">بروزرسانی خودکار هر ۳ ثانیه</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-right text-xs">
          <thead class="bg-slate-900/60 text-slate-400 border-b border-slate-700">
            <tr>
              <th class="p-3">دانش‌آموز</th>
              <th class="p-3">پایه / کد</th>
              <th class="p-3">پین آزمون</th>
              <th class="p-3">پیشرفت پاسخ‌ها</th>
              <th class="p-3">وضعیت نشست</th>
              <th class="p-3">هشدارهای امنیتی</th>
              <th class="p-3 text-center">اقدام سرپرست</th>
            </tr>
          </thead>
          <tbody id="liveTableBody" class="divide-y divide-slate-700/60">
            <!-- ردیف‌ها با JS تزریق می‌شوند -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="exam-engine.js"></script>
  <script>
    function renderLiveMonitor() {
      const sessions = getLiveSessions();
      const tbody = document.getElementById("liveTableBody");

      if (sessions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-8 text-slate-500">هیچ دانش‌آموزی در حال حاضر متصل نیست.</td></tr>`;
        return;
      }

      tbody.innerHTML = sessions.map(s => {
        let statusBadge = "";
        if (s.status === "online") {
          statusBadge = `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-lg">آنلاین در حال آزمون</span>`;
        } else if (s.status === "suspicious" || s.status === "left") {
          statusBadge = `<span class="bg-rose-500/10 text-rose-400 border border-rose-500/30 px-2.5 py-1 rounded-lg">خارج شده / مشکوک</span>`;
        } else if (s.status === "finished") {
          statusBadge = `<span class="bg-blue-500/10 text-blue-400 border border-blue-500/30 px-2.5 py-1 rounded-lg">پایان آزمون</span>`;
        }

        return `
          <tr class="hover:bg-slate-750 transition">
            <td class="p-3 font-bold text-white">${s.studentName}</td>
            <td class="p-3 text-slate-300">پایه ${s.grade} (کد: ${s.studentId})</td>
            <td class="p-3 font-mono text-amber-400 font-bold">${s.pin}</td>
            <td class="p-3">
              <div class="flex items-center gap-2">
                <div class="w-24 bg-slate-700 h-2 rounded-full overflow-hidden">
                  <div class="bg-indigo-500 h-full" style="width: ${s.progress || 0}%"></div>
                </div>
                <span class="text-slate-400 font-mono">${s.progress || 0}٪</span>
              </div>
            </td>
            <td class="p-3">${statusBadge}</td>
            <td class="p-3 font-mono ${s.warnings > 0 ? 'text-rose-400 font-bold' : 'text-slate-400'}">
              ${s.warnings || 0} مورد
            </td>
            <td class="p-3 text-center">
              ${(s.status === 'suspicious' || s.status === 'left') ? `
                <button onclick="approveRetake('${s.studentId}', '${s.pin}')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs transition">
                  🔓 صدور مجوز ورود مجدد
                </button>
              ` : `
                <span class="text-slate-500 text-[11px]">-</span>
              `}
            </td>
          </tr>
        `;
      }).join("");
    }

    function approveRetake(studentId, pin) {
      grantTeacherRetake(studentId, pin);
      alert(`مجوز ورود مجدد برای دانش‌آموز ${studentId} صادر شد. دانش‌آموز می‌تواند دوباره وارد شود.`);
      renderLiveMonitor();
    }

    // بروزرسانی هر ۳ ثانیه
    setInterval(renderLiveMonitor, 3000);
    renderLiveMonitor();
  </script>
</body>
</html>
