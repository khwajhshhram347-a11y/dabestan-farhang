<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه آزمون هوشمند - دبستان فرهنگ</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-start p-4">

  <!-- Header -->
  <header class="w-full max-w-2xl bg-white shadow-sm rounded-3xl p-5 mb-6 flex justify-between items-center border border-slate-100">
    <div>
      <h1 class="text-lg font-black text-indigo-900">دبستان فرهنگ - آزمون آنلاین</h1>
      <p id="topStudentMeta" class="text-xs text-slate-500 mt-1">لطفاً مشخصات و پین‌کد را وارد نمایید</p>
    </div>
    <div id="timerContainer" class="hidden bg-red-50 text-red-600 px-4 py-2 rounded-2xl text-sm font-bold border border-red-100 flex items-center gap-2">
      ⏱️ <span id="timerTxt">00:00</span>
    </div>
  </header>

  <!-- Login Step -->
  <main id="loginStep" class="w-full max-w-md bg-white rounded-3xl p-8 shadow-sm border border-slate-100 space-y-5">
    <div class="text-center space-y-2">
      <h2 class="text-xl font-black text-slate-900">ورود دانش‌آموز به جلسه</h2>
      <p class="text-xs text-slate-500">پین‌کد ۵ رقمی دریافتی از معلم را وارد کنید</p>
    </div>

    <div id="errorBox" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-2xl text-center font-bold"></div>

    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">نام و نام خانوادگی:</label>
        <input id="stuName" type="text" placeholder="مثال: علی رضایی" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">کد دانش‌آموزی (شناسه):</label>
        <input id="stuId" type="text" placeholder="مثال: 140201" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">پایه تحصیلی:</label>
        <select id="stuGrade" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-medium">
          <option value="6">ششم ابتدایی (تیزهوشان)</option>
          <option value="5">پنجم ابتدایی</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">پین کد آزمون:</label>
        <input id="stuPin" type="text" maxlength="5" placeholder="مثال: GAPGPTMASKTOKENolp04t2241X0X یا کد ۵ رقمی" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono tracking-widest text-center font-bold">
      </div>
    </div>

    <button id="btnStart" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition text-sm">
      ورود به آزمون و شروع
    </button>
  </main>

  <!-- Exam Step (Hidden initially) -->
  <div id="examStep" class="w-full max-w-2xl hidden space-y-4">
    <div class="bg-indigo-900 text-white p-5 rounded-3xl shadow-md flex justify-between items-center">
      <h2 id="topExamTitle" class="text-base font-black">عنوان آزمون</h2>
      <span class="text-xs bg-indigo-800 px-3 py-1.5 rounded-xl font-medium">آزمون آنلاین فعال</span>
    </div>

    <!-- Questions Container -->
    <div id="questionsContainer" class="space-y-4"></div>

    <!-- Submit Button -->
    <button id="btnFinish" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-3xl shadow-lg shadow-emerald-200 transition text-base">
      ثبت نهایی و اتمام آزمون
    </button>
  </div>

  <!-- Scripts -->
  <script src="question-bank.js"></script>
  <script src="exam-engine.js"></script>
  <script src="scoring.js"></script>
  <script>
    let activeStudent = null;
    let activeExam = null;
    let studentAnswers = {};
    let isFinished = false;
    let timerInterval = null;

    const btnStart = document.getElementById("btnStart");
    const errorBox = document.getElementById("errorBox");

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.remove("hidden");
    }

    btnStart.addEventListener("click", () => {
      errorBox.classList.add("hidden");
      const name = document.getElementById("stuName").value.trim();
      const id = document.getElementById("stuId").value.trim();
      const grade = document.getElementById("stuGrade").value;
      const pin = document.getElementById("stuPin").value.trim();

      if (!name || !id || !pin) {
        showError("لطفاً کلیه فیلدها را کامل کنید.");
        return;
      }

      const exam = getExamByPin(pin);
      if (!exam) {
        showError("آزمونی با این پین کد یافت نشد.");
        return;
      }

      activeStudent = { studentName: name, studentId: id, grade, pin, examTitle: exam.title };
      activeExam = exam;

      if (typeof registerStudentSession === "function") {
        registerStudentSession(activeStudent);
      }
      startExamView();
    });

    function startExamView() {
      document.getElementById("loginStep").classList.add("hidden");
      document.getElementById("examStep").classList.remove("hidden");
      document.getElementById("timerContainer").classList.remove("hidden");

      document.getElementById("topExamTitle").textContent = activeExam.title;
      document.getElementById("topStudentMeta").textContent = `${activeStudent.studentName} | کد: ${activeStudent.studentId}`;

      renderQuestions();
      startTimer();
      window.scrollTo(0, 0);
    }

    function renderQuestions() {
      const container = document.getElementById("questionsContainer");
      if (!activeExam.questions || activeExam.questions.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-3xl text-center text-slate-500 font-bold">سوالی برای این آزمون یافت نشد.</div>`;
        return;
      }

      container.innerHTML = activeExam.questions.map((q, idx) => {
        // Handle question text property naming flexibility (.text or .question)
        const qText = q.text || q.question || "سوال بدون متن";
        // Handle choices array vs options array
        const qChoices = q.options || q.choices || ["الف", "ب", "ج", "د"];

        return `
          <div class="bg-white rounded-3xl p-5 border border-slate-200 shadow-sm space-y-3">
            <div class="flex items-start gap-2">
              <span class="bg-indigo-50 text-indigo-700 w-7 h-7 rounded-xl flex items-center justify-center text-xs font-black shrink-0">${idx + 1}</span>
              <div class="text-sm font-bold text-slate-800 leading-relaxed pt-1">${qText}</div>
            </div>
            <div class="space-y-2 pt-2">
              ${qChoices.map((choiceText, optIdx) => `
                <label class="flex items-center gap-3 p-3 rounded-2xl border border-slate-100 bg-slate-50/60 cursor-pointer hover:bg-indigo-50/40 transition">
                  <input type="radio" name="q_${idx}" value="${optIdx}" onchange="selectOption(${idx}, ${optIdx})" class="w-4 h-4 text-indigo-600">
                  <span class="text-xs text-slate-700 font-medium">${choiceText}</span>
                </label>
              `).join("")}
            </div>
          </div>
        `;
      }).join("");
    }

    function selectOption(qIdx, optIdx) {
      studentAnswers[qIdx] = optIdx;
      if (typeof updateStudentProgress === "function") {
        updateStudentProgress(activeStudent.studentId, activeStudent.pin, Object.keys(studentAnswers).length, activeExam.questions.length);
      }
    }

    function startTimer() {
      let durationMinutes = Number(activeExam.duration) || 30;
      let totalSeconds = durationMinutes * 60;
      const timerTxt = document.getElementById("timerTxt");

      timerInterval = setInterval(() => {
        if (totalSeconds <= 0) {
          clearInterval(timerInterval);
          alert("زمان آزمون به پایان رسید! ثبت خودکار برگه.");
          submitExamData();
          return;
        }
        totalSeconds--;
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        timerTxt.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }, 1000);
    }

    document.getElementById("btnFinish").addEventListener("click", () => {
      if (confirm("آیا از ارسال و ثبت نهایی پاسخ‌ها اطمینان دارید؟")) {
        submitExamData();
      }
    });

    function submitExamData() {
      if (isFinished) return;
      isFinished = true;
      if (timerInterval) clearInterval(timerInterval);

      let scoreData = {
        studentName: activeStudent.studentName,
        studentId: activeStudent.studentId,
        examTitle: activeExam.title,
        grade: activeExam.grade,
        totalQuestions: activeExam.questions.length,
        answers: studentAnswers,
        submittedAt: new Date().toLocaleTimeString('fa-IR')
      };

      // Calculate score if scoring.js is loaded
      if (typeof calculateTizhooshanScore === "function") {
        const evaluated = calculateTizhooshanScore(activeExam.questions, studentAnswers);
        scoreData.score = evaluated.score;
        scoreData.percentage = evaluated.percentage;
        scoreData.correctCount = evaluated.correct;
        scoreData.wrongCount = evaluated.wrong;
        scoreData.blankCount = evaluated.blank;
      }

      localStorage.setItem("lastExamResults", JSON.stringify(scoreData));
      if (typeof completeStudentSession === "function") {
        completeStudentSession(activeStudent.studentId, activeStudent.pin);
      }

      const reportAllowed = localStorage.getItem("reportAllowed");
      if (reportAllowed === "yes") {
        window.location.href = "report-card.html";
      } else {
        alert("آزمون شما با موفقیت ثبت شد. با تشکر!");
        window.location.href = "index.html";
      }
    }
  </script>
</body>
</html>
