<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به آزمون - دبستان فرهنگ</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 24px; font-size: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #475569; font-size: 14px; font-weight: 500; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Vazirmatn', sans-serif; font-size: 14px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        button { width: 100%; background: #4f46e5; color: white; border: none; padding: 14px; border-radius: 8px; font-family: 'Vazirmatn', sans-serif; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        button:hover { background: #4338ca; }
        .error-msg { background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>سامانه آزمون آنلاین دبستان فرهنگ</h2>
    <div id="errorBox" class="error-msg"></div>
    
    <div class="form-group">
        <label>نام و نام خانوادگی دانش‌آموز</label>
        <input type="text" id="stuName" placeholder="مثال: علی رضایی">
    </div>
    
    <div class="form-group">
        <label>کد دانش‌آموزی (مثلاً 1 تا 4 رقم)</label>
        <input type="text" id="stuId" placeholder="مثال: 1234">
    </div>

    <div class="form-group">
        <label>پین کد آزمون</label>
        <input type="text" id="stuPin" value="GAPGPTMASKTOKENaxa2scto8m7X0X" placeholder="پین ۵ رقمی">
    </div>

    <button onclick="startExam()">ورود به جلسه آزمون</button>
</div>

<script src="exam-engine.js"></script>
<script>
    // مقداردهی پین پیش‌فرض در فیلد
    document.getElementById('stuPin').value = "GAPGPTMASKTOKENaxa2scto8m7X1X";

    function startExam() {
        const name = document.getElementById('stuName').value.trim();
        const id = document.getElementById('stuId').value.trim();
        const pin = document.getElementById('stuPin').value.trim();
        const errorBox = document.getElementById('errorBox');

        if (!name || !id || !pin) {
            errorBox.textContent = "لطفاً نام، کد دانش‌آموزی و پین کد را وارد کنید.";
            errorBox.style.display = 'block';
            return;
        }

        // بررسی آزمون در موتور سیستم
        let exam = getExamByPin(pin);
        if (!exam) {
            errorBox.textContent = "آزمونی با این پین کد یافت نشد!";
            errorBox.style.display = 'block';
            return;
        }

        // ذخیره اطلاعات دانش‌آموز در حافظه و ورود
        const studentSession = {
            studentId: id,
            studentName: name,
            grade: exam.grade || "6",
            pin: pin,
            examTitle: exam.title
        };

        registerStudentSession(studentSession);
        localStorage.setItem('farhang_active_student', JSON.stringify(studentSession));
        localStorage.setItem('farhang_active_exam', JSON.stringify(exam));

        // هدایت به صفحه سوالات (یا پیام موفقیت)
        alert("ورود با موفقیت انجام شد! آزمون آماده است.");
    }
</script>

</body>
</html>
