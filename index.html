<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه آزمون‌یار دبستان فرهنگ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: white; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; padding: 30px; text-align: center; }
    h2 { color: #1e3a8a; margin-bottom: 10px; font-size: 20px; }
    p { color: #64748b; font-size: 13px; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; text-align: right; }
    label { display: block; margin-bottom: 6px; font-size: 13px; color: #334155; font-weight: bold; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #2563eb; ring: 2px solid #bfdbfe; }
    button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    button:hover { background: #1d4ed8; }
    .error { color: #ef4444; font-size: 12px; margin-top: 10px; display: none; }
    .student-link { margin-top: 20px; font-size: 13px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    .student-link a { color: #059669; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

<div class="card">
  <h2>سامانه آزمون‌یار دبستان فرهنگ</h2>
  <p>ورود آموزگاران و مدیریت آزمون</p>

  <form id="loginForm">
    <div class="form-group">
      <label>نام کاربری:</label>
      <input type="text" id="username" placeholder="sarparast" required>
    </div>
    <div class="form-group">
      <label>رمز عبور:</label>
      <input type="password" id="password" placeholder="••••" required>
    </div>
    <button type="submit">ورود به پنل آموزگار</button>
    <div id="errorMsg" class="error">نام کاربری یا رمز عبور اشتباه است!</div>
  </form>

  <div class="student-link">
    دانش‌آموز هستید؟ <a href="student-exam.html">ورود به صفحه آزمون دانش‌آموز</a>
  </div>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value.trim();
    
    if (u === 'sarparast' && p === '1234') {
      window.location.href = 'dashboard.html';
    } else {
      document.getElementById('errorMsg').style.display = 'block';
    }
  });
</script>

</body>
</html>
